<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Insurance Support Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #dde1e6;
    --text: #1c1f24;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-text: #ffffff;
    --bubble-user: #2f6fed;
    --bubble-user-text: #ffffff;
    --bubble-ai: #eef1f5;
    --bubble-ai-text: #1c1f24;
    --warn-bg: #fff4e5;
    --warn-text: #7a4a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel: #1e2128;
      --border: #2c313a;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --accent: #5b8def;
      --accent-text: #0b1220;
      --bubble-user: #5b8def;
      --bubble-user-text: #0b1220;
      --bubble-ai: #262a32;
      --bubble-ai-text: #e6e8eb;
      --warn-bg: #3a2c0f;
      --warn-text: #f2c76a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #app {
    width: 100%;
    max-width: 640px;
    height: 100%;
    max-height: 800px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
  }
  header .customer {
    font-size: 13px;
    color: var(--muted);
  }
  header button {
    font-size: 12px;
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  header button:hover { border-color: var(--accent); }

  #start-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  #start-screen p { color: var(--muted); margin: 0 0 4px; }
  #start-screen form {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 320px;
  }

  #chat-screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row { display: flex; flex-direction: column; }
  .bubble-row.user { align-items: flex-end; }
  .bubble-row.ai { align-items: flex-start; }
  .speaker {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 3px;
    padding: 0 4px;
  }
  .bubble {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .bubble.user { background: var(--bubble-user); color: var(--bubble-user-text); border-bottom-right-radius: 4px; }
  .bubble.ai { background: var(--bubble-ai); color: var(--bubble-ai-text); border-bottom-left-radius: 4px; }
  .bubble.warn { background: var(--warn-bg); color: var(--warn-text); }

  .feedback-row { display: flex; gap: 4px; padding: 0 4px; }
  .feedback-row button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 7px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
  }
  .feedback-row button:hover { border-color: var(--accent); }
  .feedback-row button.selected { border-color: var(--accent); color: var(--accent); }
  .feedback-row button:disabled { cursor: default; }

  #composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: default; }

  #status {
    font-size: 12px;
    color: var(--muted);
    padding: 0 16px 8px;
    min-height: 16px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🛡️ Insurance Support Assistant</h1>
    <div id="header-right"></div>
  </header>

  <div id="start-screen">
    <p>Enter a customer ID to start a conversation (try <code>CUST001</code> or <code>CUST002</code>).</p>
    <form id="start-form">
      <input type="text" id="customer-id-input" value="CUST001" autocomplete="off" />
      <button type="submit" class="primary">Start</button>
    </form>
  </div>

  <div id="chat-screen">
    <div id="messages"></div>
    <div id="status"></div>
    <form id="composer">
      <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" />
      <button type="submit" class="primary" id="send-btn">Send</button>
    </form>
  </div>
</div>

<script>
  const startScreen = document.getElementById("start-screen");
  const chatScreen = document.getElementById("chat-screen");
  const startForm = document.getElementById("start-form");
  const customerIdInput = document.getElementById("customer-id-input");
  const composer = document.getElementById("composer");
  const messageInput = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const messagesEl = document.getElementById("messages");
  const statusEl = document.getElementById("status");
  const headerRight = document.getElementById("header-right");

  let sessionId = null;
  let customerId = null;

  function addBubble(role, text, speaker) {
    const row = document.createElement("div");
    row.className = "bubble-row " + role;

    if (speaker) {
      const label = document.createElement("div");
      label.className = "speaker";
      label.textContent = speaker;
      row.appendChild(label);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.textContent = text;
    row.appendChild(bubble);

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addFeedbackRow(traceId) {
    if (!traceId) return;

    const row = document.createElement("div");
    row.className = "feedback-row";
    const upBtn = document.createElement("button");
    upBtn.textContent = "👍";
    const downBtn = document.createElement("button");
    downBtn.textContent = "👎";

    const sendFeedback = async (positive) => {
      upBtn.disabled = downBtn.disabled = true;
      (positive ? upBtn : downBtn).classList.add("selected");
      try {
        await fetch(`/api/session/${sessionId}/feedback`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ trace_id: traceId, positive }),
        });
      } catch (err) {
        // Feedback is best-effort; a failed request shouldn't disrupt the chat.
      }
    };

    upBtn.onclick = () => sendFeedback(true);
    downBtn.onclick = () => sendFeedback(false);
    row.appendChild(upBtn);
    row.appendChild(downBtn);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    messageInput.disabled = busy;
    statusEl.textContent = busy ? "Thinking..." : "";
  }

  function renderHeader() {
    headerRight.innerHTML = "";
    const label = document.createElement("span");
    label.className = "customer";
    label.textContent = "Customer: " + customerId + "  ";
    const switchBtn = document.createElement("button");
    switchBtn.textContent = "Switch customer";
    switchBtn.onclick = () => {
      sessionId = null;
      customerId = null;
      messagesEl.innerHTML = "";
      chatScreen.style.display = "none";
      startScreen.style.display = "flex";
      headerRight.innerHTML = "";
    };
    headerRight.appendChild(label);
    headerRight.appendChild(switchBtn);
  }

  startForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const id = customerIdInput.value.trim();
    if (!id) return;

    const res = await fetch("/api/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: id }),
    });
    if (!res.ok) {
      alert("Could not start session: " + (await res.text()));
      return;
    }
    const data = await res.json();
    sessionId = data.session_id;
    customerId = data.customer_id;

    startScreen.style.display = "none";
    chatScreen.style.display = "flex";
    renderHeader();
    messageInput.focus();
  });

  composer.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = messageInput.value.trim();
    if (!text || !sessionId) return;

    addBubble("user", text, null);
    messageInput.value = "";
    setBusy(true);

    try {
      const res = await fetch(`/api/session/${sessionId}/message`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      if (!res.ok) {
        addBubble("ai", "Error: " + (await res.text()), "system");
        return;
      }
      const data = await res.json();
      for (const reply of data.replies) {
        addBubble("ai", reply.content, reply.speaker);
      }
      addFeedbackRow(data.trace_id);
    } catch (err) {
      addBubble("ai", "Network error: " + err.message, "system");
    } finally {
      setBusy(false);
      messageInput.focus();
    }
  });
</script>
</body>
</html>
